  - "suite 通过知识库确认主题色 #196eff 并定位到'语义不一致'的 warning 按钮（更精准），native 抓首个可见按钮"
  - "suite 消耗 7k vs native 3k context（2.3x 开销），但选择更 deliberate、coverage 1 vs 0"
