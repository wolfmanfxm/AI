key_finding: "#1 context_contract 语义化未生效（只改了声明没改消费逻辑）：suite agent 获取知识时仍直接读 .md 文件（patterns/form.md、components/catalog.md、rules/*.md、experience/*.md），没有走 Query API。should_read→query 只改了 skill.yaml 的字段名 + skills.generated.yaml，但 SKILL.md 核心原则（'查 components/catalog.md'）、workflow-engine 的 Query 声明、prompts 都没改消费逻辑——agent 读到的还是 .md 路径。这是「改声明未改消费」的典型。要真正生效，需把 SKILL.md/prompts 里的 .md 读取改成 @adapter:knowledge.query 语义调用。另外：落点发散（native 选 customerManage，suite 选 baseData），suite 的 standard path 规划把'个人信息登记'归到了 baseData 而非 target_hint 的 customerManage。"
