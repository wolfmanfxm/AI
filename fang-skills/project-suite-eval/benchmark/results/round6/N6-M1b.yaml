key_finding: >
  #3 convergence 从「声明没消费」修复为「真正被消费」。修复前静态检查发现：convergence 只写进了
  primitive + skill-io.md + roadmap，消费端（stage 模板 + prompts）完全没接——且它挂的 result.md
  本身在 prompts 里也没被产出（gates.yaml 声明「必须输出 result.md」，实际产出 completion-report.md /
  validation-report.md），双重悬空。修复：把 convergence 判定接入 stage-templates/delivery.md +
  validation.md（所有 skill 经 @engine 自动继承），并更新 convergence.md 的定位从「result.md 附带」
  改为「收尾 stage 产出」。修复后 M1b 验证：agent 在 validation 收尾真实产出
  convergence: sufficient → stop，且 evidence 逐条支撑（target 决议 + domain 对齐 + 规避 round5 陷阱）。
  这再次印证 round5 #1 的规律：改声明 ≠ 改消费，消费端（模板/prompts）才是决定行为的点。
  同时复验 #4 target 放置决议仍生效（落点 customerManage 正确）。
