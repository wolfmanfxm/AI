key_comparison:
  - "两者都从零搭建了完整业务模块（CRUD+审批+报表），复用 workspace 标准组件链，reuse 均 0.9-1"
  - "落点不同：native 选 serviceFeeManage（服务费），suite 选 incentiveManage（渠道激励）——任务主题自由度高"
  - "suite 产出更完整（12 文件 1658 行 vs 10 文件）、显式状态机（草稿/待审批/已通过/已驳回）、7 条决策；native 更精简"
  - "suite 的知识库让它避开了真实坑：FormWrapper.validate 返回 boolean、FormInput 不接 label/prop、字典枚举要 computed——这些 native 未显式提及"
  - "suite 的 99.7% co-usage 等量化证据 vs native 定性描述——suite 的 Evidence 更硬"
