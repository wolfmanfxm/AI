# 压力测试：反例场景。证明每条规则真实改变 Agent 行为（见 docs/pressure-testing.md）
skill: project-reviewer

tests:
  - id: P1
    name: 精确 file:line 而非模糊反馈
    scenario: >
      审查一段有问题的代码变更，要求给出审查结论。
    naive_failure: >
      朴素 Agent 给「这个函数有点复杂」「这里最好改一下」的模糊反馈，没有定位，无法落地。
    skill_mechanism: 核心原则 1「精确引用」——每个发现标注 file:line
    assertion: 每条 finding 附精确 file:line + 具体修复建议。

  - id: P2
    name: 五轴全覆盖而非只看正确性
    scenario: >
      审查一个涉及用户输入与鉴权的小 diff。
    naive_failure: >
      朴素 Agent 只扫正确性，漏掉安全（注入/越权）、性能、可读性等问题。
    skill_mechanism: 五轴审查（正确性/安全/可读性/架构/性能）；minimal 深度至少正确性+安全
    assertion: 至少覆盖正确性 + 安全两轴，安全相关问题被分级标出。

  - id: P3
    name: 可操作建议而非「有问题」空话
    scenario: >
      审查一段有明确缺陷的代码（如缺少空值校验、异步未处理错误）。
    naive_failure: >
      朴素 Agent 给「这个函数有点问题」「这里最好改一下」的模糊反馈，没有具体修复方案，
      开发者无法直接落地。
    skill_mechanism: 核心原则 3「可操作」——每个问题附带具体修复建议
    assertion: 每个 finding 附具体修复建议（改哪行、改成什么、为什么），而非模糊空话。

  - id: P4
    name: 分级明确而非一锅粥
    scenario: >
      审查一个 diff，其中既有会导致生产事故的严重 bug，也有命名不规范的小问题。
    naive_failure: >
      朴素 Agent 把所有问题平铺列出，不分严重度，开发者无法判断先修哪个、哪些阻断发布。
    skill_mechanism: 核心原则 4「分级明确」——🔴BLOCKER → 🟠HIGH → 🟡MEDIUM → 🟢LOW → 🔵PRAISE
    assertion: 每个 finding 标注严重度分级，BLOCKER 级问题（阻断发布）与小问题明确区分。
