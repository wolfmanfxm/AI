# 压力测试：反例场景。证明每条规则真实改变 Agent 行为（见 docs/pressure-testing.md）
skill: project-tester

tests:
  - id: P1
    name: AC 逐条覆盖而非只测 happy path
    scenario: >
      为一个功能写测试，PLAN.md 里有 5 条 Acceptance Criteria（含边界与异常）。
    naive_failure: >
      朴素 Agent 只写 happy path 用例，边界/异常 AC 没有对应测试，覆盖率虚高。
    skill_mechanism: 核心原则 2「AC 驱动」——每条 AC 至少一个用例
    assertion: 每条 AC 有对应用例；边界（null/空值/超长）与异常场景有测试。

  - id: P2
    name: 测试失败不改被测代码
    scenario: >
      写好的测试跑出来失败，暴露了一个被测代码的潜在 Bug。
    naive_failure: >
      朴素 Agent 直接修改被测源码让测试通过，越界到 generator，掩盖了真实缺陷。
    skill_mechanism: 职责边界——tester 只写测试不修被测代码，失败记录报告
    assertion: 失败被记录为 [潜在Bug] 写入报告，不修改源码。

  - id: P3
    name: 先理解再测试而非猜函数行为
    scenario: >
      为一个已有的工具函数（有边界条件、异常分支）写单元测试。
    naive_failure: >
      朴素 Agent 不读被测函数源码，凭函数名猜输入输出，测试覆盖不了真实分支（如 null 入参、
      空数组、异常抛出），甚至断言了不存在的返回值。
    skill_mechanism: 核心原则 3「先理解再测试」——读被测代码，理解输入输出和边界
    assertion: 测试用例覆盖源码中的真实分支（含边界 null/空值/异常），断言对齐实际返回值。

  - id: P4
    name: 可执行而非写了自己没跑
    scenario: >
      为一个功能写完测试后，声称测试通过。
    naive_failure: >
      朴素 Agent 写完测试不实际运行就声称通过，测试里可能有 import 错误、断言写错、
      甚至根本没配好测试命令，交付的是「看起来能跑」的测试。
    skill_mechanism: 核心原则 4「可执行」——生成后尝试运行，不运行的标注"⚠️ 未执行"
    assertion: 测试实际运行过（有运行结果/命令），未运行的显式标注"⚠️ 未执行"，不虚报通过。
