# Skill Interface Standard v1.2.0
#
# 所有 skill 的标准化接口定义（intrinsic 部分）。
# 每个 skill.yaml 必须包含 interface: 块，Host 直接解析即可调度。
#
# ⚠️ v1.2.0 变更：Runtime Policy 字段（quality_gate / rollback / recovery / reliability / stage_config）
# 已从 interface 块移至 runtime/config/skill-policy.yaml（编排层，非 Skill Contract）。
# 本 schema 只描述 skill 的 intrinsic I/O 契约。

version: "1.2.0"

# ═══ Interface Fields（intrinsic）═══

fields:

  inputs:
    description: 本 Skill 运行需要什么。Host 据此检查前置条件。
    type: array
    item_schema:
      name: string          # 资源名，如 "context.json"
      type: string          # artifact-type: knowledge/context/graph/planning/design/implementation/test/review/refactored-code/documentation/release/state/request；或 context-package（Knowledge 注入契约，非路由 artifact，见 context-package.schema.json）
      required: boolean     # true = 缺失时 BLOCK
      source: string        # producer skill 或文件路径
      fixture: boolean      # v1.2: true = file-backed fixture (可 checksum 验证); false = ephemeral/会话临时
      description: string   # 在本 Skill 中的用途

  outputs:
    description: 本 Skill 产出什么。Host 据此连接上下游。
    type: array
    item_schema:
      name: string          # 产出文件名或资源名，如 "PLAN.md"
      type: string          # artifact-type
      confidence_range: string  # 典型置信度范围，如 "70-95"
      depends_on_inputs: [string]  # 产出依赖哪些输入

  side_effects:
    description: 执行副作用。Host 据此决定是否可并行、是否可重试。
    type: object
    properties:
      writes_state: boolean       # 是否写入 .project-knowledge/runtime/state.json
      writes_knowledge: boolean   # 是否写入 .project-knowledge/（**任何**写，含 reports/ 等任务产物落点）
      modifies_code: boolean      # 是否**改动既有**项目源码。新增文件不算——
                                  # tester 新增 *.test.ts 记 false、refactorer 改写既有源码记 true。
                                  # 若 Host 需要「是否在源码树内产生文件」这个更强的语义，另加字段，不要复用本字段。
      writes_timeline: boolean    # 是否追加 timeline.json

  failure_modes:
    description: 已知失败模式。Host 据此决定重试/降级/阻断。
    type: array
    item_schema:
      condition: string     # 触发条件
      severity: string      # BLOCKED | DEGRADED | WARNING | FATAL
      recovery: string      # 恢复动作

  stages:
    description: 本 Skill 的阶段列表。Host 据此加载对应的 Stage Contract 模板。
    type: array
    item_schema:
      name: string          # discovery | planning | execution | validation | delivery
                            # Host 从 workflow-protocol/references/stage-contract.md 加载模板
