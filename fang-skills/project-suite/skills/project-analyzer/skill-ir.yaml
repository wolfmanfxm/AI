# Skill IR: project-analyzer — machine-readable, regenerated on skill.yaml change
id: project-analyzer
version: "1.3.1"
mode: Production
description: "分析软件项目并生成可复用的项目知识库：Multi-Extractor 架构（10 个提取器 + Candidate→Verify→Accept + Evidence Score + INDEX.md）。 触发词：分析项目、代码分析、项目审计、扫描项目、梳理组件、更新项目知识、刷新项目知识、 项目规范、编码规范、analyze codebase、scan project、project refresh。 不用于：已有知识覆盖且无明显漂移的普通开发任务。"
boundary: "只分析项目生成知识文件，不修改源码"
produces: [KnowledgeBase,Context,Graph,Recommendation]
consumes: []
stages: [discovery, execution, validation, delivery]
verification: { checks: 7, source: prompts/validation.md }
evidence: { format: knowledge-object.schema.json, source: graph.json }
failure_conditions: { modes: 4, levels: "WARNING→retry, DEGRADED→continue, BLOCKED→ask, FATAL→stop" }
last_reviewed: "2026-08-04"
