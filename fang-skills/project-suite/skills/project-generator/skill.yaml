id: project-generator
version: "1.3.0"
mode: Production
owner: project-suite
category: creation
complexity: { min: low, max: high }
cost: high
description: "按项目规范生成生产级代码，Execute→Verify"
verification: { mode: direct-verify }
depth_profiles: { simple: minimal, medium: standard, complex: full }
capabilities: [code-generation, pattern-matching, query-api]
confidence_min: 70
requires: []
produces: [Code]
consumes: [KnowledgeBase, KnowledgeIndex, Plan, Architecture, Context, Graph]

boundary: 只写代码不做设计，缺少上游产物时提示先执行 planner/architect
last_reviewed: "2026-08-04"
review_cadence_days: 90

triggers_cn: [写一个, 实现, 创建组件, 新增页面, 开发这个功能, 生成代码, 帮我写, 开发, 编写, 添加, 修改, 调整, 修复, 删除, 改, 搭建]
triggers_en: [implement, create component, build feature, generate code, write a, modify, fix, delete, change, update, build]

context_contract:
  must_read: [context-package.json, PLAN.md, context.json, ARCHITECTURE.md]
  query: []
  neednt_read: [observations/, reports/]

interface:
  inputs:
    - { name: context-package.json, type: context, required: true, source: knowledge-resolver, fixture: true, description: "预消化知识包: pattern+constraints+components" }
    - { name: PLAN.md, type: planning, required: true, source: project-planner, fixture: true, description: Goal+Scope+Task Breakdown }
    - { name: ARCHITECTURE.md, type: design, required: false, source: project-architect, fixture: true, description: ADR决策记录 }
    - { name: graph.json, type: graph, required: false, source: project-analyzer, fixture: true, description: 已有组件/API不重复生成 }
  outputs:
    - { name: "*.vue/*.ts/*.js", type: implementation, confidence_range: "70-95", description: 符合项目规范的生产级代码 }
  side_effects: { writes_state: true, writes_knowledge: false, modifies_code: true, writes_timeline: true }
  failure_modes:
    - { condition: context-package.json缺失且PLAN.md缺失, severity: BLOCKER, recovery: 提示先执行planner }
    - { condition: graph.json显示组件已存在, severity: WARNING, recovery: "标记[REUSE],跳过生成" }
  stages: [discovery, execution, validation]
