# Skill IR: project-generator — machine-readable, regenerated on skill.yaml change
id: project-generator
version: "1.3.0"
mode: Production
description: "根据需求和项目规范生成生产级代码：Vue 3 组件、页面、API 模块、工具函数、类型定义。 必须遵循项目现有模式，从 .project-knowledge/ 提取规范而非凭记忆。 触发词：写一个、实现、创建组件、新增页面、开发这个功能、生成代码、帮我写、implement、 create component、build feature、generate code、write a、开发、编写、添加。 产出：代码文件（.vue / .ts / .js 等）+ completion-report.md。"
boundary: "只写代码不做设计，缺少上游产物时提示先执行 planner/architect"
produces: [Code]
consumes: [KnowledgeBase,KnowledgeIndex,Plan,Architecture,Context,Graph]
depends_on: [project-architect]
stages: [discovery, execution, validation]
verification: { checks: 10, source: prompts/verifier.md }
evidence: { format: knowledge-object.schema.json, source: graph.json }
exit_criteria: { conditions: 20, source: prompts/execution.md }
failure_conditions: { modes: 2, levels: "WARNING→retry, DEGRADED→continue, BLOCKED→ask, FATAL→stop" }
last_reviewed: "2026-08-04"
