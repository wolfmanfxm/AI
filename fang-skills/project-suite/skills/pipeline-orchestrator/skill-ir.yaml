# Skill IR: pipeline-orchestrator — machine-readable, regenerated on skill.yaml change
id: pipeline-orchestrator
version: "1.0.0"
mode: Production
description: "跨 Skill Pipeline 编排引擎。读取 registry 自动发现依赖，按 DAG 顺序调度执行， 传递上下文，处理失败。从 9 个独立 Skill 变成 1 个协调执行的 Pipeline Framework。 触发词：全流程、一键执行、自动编排、pipeline、完整链路、端到端、从分析到发布、自动化开发、full pipeline、orchestrate、end-to-end、auto sdlc、run all、complete workflow。 产出：pipeline-state.json + pipeline-report.md。"
boundary: "编排跨 Skill pipeline 执行，不替代任何单个 Skill 的功能"
produces: [PipelineExecution]
consumes: [KnowledgeBase,Plan,Architecture,Code,Test,Review,Documentation,Release]
depends_on: []
stages: [discovery, orchestrate, validation, delivery]
verification: { checks: 0, source: prompts/verifier.md }
evidence: { format: knowledge-object.schema.json, source: graph.json }
exit_criteria: { conditions: 0, source: prompts/execution.md }
failure_conditions: { modes: 3, levels: "WARNING→retry, DEGRADED→continue, BLOCKED→ask, FATAL→stop" }
last_reviewed: "2026-08-04"
