id: project-planner
version: "1.3.0"
mode: Production
owner: project-suite
category: planning
complexity: { min: medium, max: high }
cost: medium
description: "需求收敛→完整性检查→自适应访谈→9模块执行契约"
verification: { mode: candidate-verify-accept }
depth_profiles: { simple: minimal, medium: standard, complex: full }
capabilities: [adaptive-interview, completeness-check, plan-generation]
confidence_min: 70
requires: []
produces: [Plan]
consumes: [KnowledgeBase, KnowledgeIndex, Context, Graph]

boundary: 只做计划不写代码，发现问题记录在风险矩阵不直接修改
last_reviewed: "2026-08-04"
review_cadence_days: 90

triggers_cn: [任务拆解, 开发计划, 需求分析, 排期, 估算工作量, 分解任务, sprint 规划, 任务规划]
triggers_en: [break down tasks, plan sprint, estimate effort, create dev plan]

context_contract:
  must_read: [context.json]
  query: [architecture, components]
  neednt_read: [observations/, reports/]

interface:
  inputs:
    - { name: context.json, type: context, required: true, source: project-analyzer, fixture: true, description: 技术栈/路径别名/约定 }
    - { name: knowledge-index.json, type: state, required: true, source: project-analyzer, fixture: true, description: capability→文件映射 }
    - { name: graph.json, type: graph, required: false, source: project-analyzer, fixture: true, description: 模块依赖关系 }
  outputs:
    - { name: PLAN-<feature>.md, type: planning, confidence_range: "70-95", depends_on_inputs: [context.json, knowledge-index.json] }
    - { name: context-package.json, type: context, confidence_range: "70-95", description: 预消化知识包, Generator直接消费 }
  side_effects: { writes_state: true, writes_knowledge: true, modifies_code: false, writes_timeline: true }
  failure_modes:
    - { condition: 需求信息完全缺失, severity: BLOCKER, recovery: 拒绝执行,提示补充需求 }
    - { condition: 上游analyzer confidence<70, severity: DEGRADED, recovery: 标注"⚠️上游低置信度",继续但降级 }
  stages: [discovery, code-audit, execution, validation, delivery]
