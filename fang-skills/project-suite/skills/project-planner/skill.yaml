id: project-planner
version: "1.3.0"
mode: Production
owner: project-suite
priority: 20
requires: []
produces: [Plan]
consumes: [KnowledgeBase, KnowledgeIndex, Context, Graph]
depends_on: [project-analyzer]

depends_on_skill:
  project-analyzer: ">=1.3"    # 需要 context.json + knowledge-index.json + graph.json

parallel_with: []
boundary: 只做计划不写代码，发现问题记录在风险矩阵不直接修改

triggers_cn: [任务拆解, 开发计划, 需求分析, 排期, 估算工作量, 分解任务, sprint 规划, 任务规划]
triggers_en: [break down tasks, plan sprint, estimate effort, create dev plan]

context_contract:
  must_read: [knowledge-index.json, context.json]
  should_read: [architecture/overview.md, components/catalog.md]
  neednt_read: [observations/, reports/]

interface:
  inputs:
    - { name: context.json, type: context, required: true, source: project-analyzer, description: 技术栈/路径别名/约定 }
    - { name: knowledge-index.json, type: state, required: true, source: project-analyzer, description: capability→文件映射 }
    - { name: graph.json, type: graph, required: false, source: project-analyzer, description: 模块依赖关系 }
  outputs:
    - { name: PLAN-<feature>.md, type: planning, confidence_range: "70-95", depends_on_inputs: [context.json, knowledge-index.json] }
    - { name: context-package.json, type: context, confidence_range: "70-95", description: 预消化知识包, Generator直接消费 }
  side_effects: { writes_state: true, writes_knowledge: true, modifies_code: false, writes_timeline: true }
  failure_modes:
    - { condition: 需求信息完全缺失, severity: BLOCKER, recovery: 拒绝执行,提示补充需求 }
    - { condition: 上游analyzer confidence<70, severity: DEGRADED, recovery: 标注"⚠️上游低置信度",继续但降级 }
  quality_gate: { min_confidence_for_pass: 90, requires_review_below: 70, blocks_downstream_below: 40 }
  rollback: { method: git_revert, safe_to_retry: true, retry_max: 1 }
