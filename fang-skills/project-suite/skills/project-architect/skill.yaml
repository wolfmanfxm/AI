id: project-architect
version: "1.3.0"
mode: Production
owner: project-suite
category: planning
complexity: { min: medium, max: high }
cost: medium
description: "技术选型+模块设计+API契约，ADR格式决策记录"
verification: { mode: candidate-verify-accept }
depth_profiles: { simple: minimal, medium: standard, complex: full }
capabilities: [tech-selection, module-design, api-contract]
confidence_min: 70
requires: []
produces: [Architecture]
consumes: [KnowledgeBase, Plan, Context, Graph]

boundary: 只做设计不写代码，发现不符记录在 ARCHITECTURE.md 不直接修改
last_reviewed: "2026-08-04"
review_cadence_days: 90

triggers_cn: [架构设计, 技术选型, 模块设计, 系统设计, 数据库设计, API 设计, 架构评审, 怎么设计, 选什么技术, 模块怎么划分, 接口怎么定义]
triggers_en: [design architecture, tech stack, system design, API design]

context_contract:
  must_read: [context.json, PLAN.md]
  query: [architecture, components, api]
  neednt_read: [observations/, reports/]

interface:
  inputs:
    - { name: context.json, type: context, required: true, source: project-analyzer, fixture: true, description: 技术栈/路径别名/约定 }
    - { name: PLAN.md, type: planning, required: false, source: project-planner, fixture: true, description: Decision→Task映射 }
    - { name: graph.json, type: graph, required: false, source: project-analyzer, fixture: true, description: 模块依赖关系 }
  outputs:
    - { name: ARCHITECTURE-<topic>.md, type: design, confidence_range: "75-90", description: ADR决策记录+模块图+API契约 }
  side_effects: { writes_state: true, writes_knowledge: true, modifies_code: false, writes_timeline: true }
  failure_modes:
    - { condition: 设计范围完全未指定, severity: BLOCKER, recovery: 提示先执行/project-planner }
    - { condition: 对比矩阵分差<10%无明确最优, severity: WARNING, recovery: AskUserQuestion让用户选择 }
  stages: [discovery, code-audit, graph-analysis, execution, validation, delivery]
