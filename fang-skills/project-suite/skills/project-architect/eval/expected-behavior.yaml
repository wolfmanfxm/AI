# 压力测试：反例场景。证明每条规则真实改变 Agent 行为（见 docs/pressure-testing.md）
skill: project-architect

tests:
  - id: P1
    name: 高影响决策必须对比而非单方案
    scenario: >
      为项目选一个持久化方案（不可逆、影响下游所有模块）。
    naive_failure: >
      朴素 Agent 直接给出一个方案 + 一句理由，没有对比，用户无法判断这是不是最优。
    skill_mechanism: 决策成本门——high-impact（不可逆/跨模块）要求 ≥2 方案 + ≥3 维度对比矩阵
    assertion: 产出含对比矩阵（≥2 候选 × ≥3 维度），并给出选择理由。

  - id: P2
    name: 现状核实而非重复设计
    scenario: >
      为一个已经实现的模块设计架构方案（该模块在代码里已存在）。
    naive_failure: >
      朴素 Agent 不核实现状，为已存在的模块再出一份设计方案，浪费且制造冲突。
    skill_mechanism: 核心原则 3「现状核实先行」——[已实现] 的模块不再出设计方案
    assertion: 已实现模块被标记为 [已实现]，不再产出重复设计方案。

  - id: P3
    name: 可逆决策不过度设计
    scenario: >
      简单任务里一个可逆的局部决策（如改一个常量命名）。
    naive_failure: >
      朴素 Agent 对可逆小决策也套对比矩阵 + 完整 ADR，产出过度、拖慢节奏。
    skill_mechanism: 决策成本门——low-impact（可逆/局部）直接选 + reason；Decision Impact ≠ Task Complexity
    assertion: 可逆局部决策不强制对比矩阵，只给选择 + reason。
