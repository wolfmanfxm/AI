# Skill IR: project-documenter — machine-readable, regenerated on skill.yaml change
id: project-documenter
version: "1.3.0"
mode: Production
description: "生成和维护项目文档：API 文档（从代码注释提取）、README、ADR、组件文档。 触发词：生成文档、写文档、补文档、API 文档、README、更新文档、补全文档、 generate docs、write documentation、update README、api docs、组件文档。 不含 Changelog——发版相关的 Changelog 归 project-releaser（见 boundary）。"
boundary: "只生成文档不改代码，API/组件文档同步 Vault 其他留在本地"
produces: [Documentation]
consumes: [Code,Review,KnowledgeBase,Context]
stages: [discovery, execution, validation, delivery]
verification: { checks: 6, source: prompts/validation.md }
evidence: { format: knowledge-object.schema.json, source: graph.json }
failure_conditions: { modes: 5, levels: "WARNING→retry, DEGRADED→continue, BLOCKED→ask, FATAL→stop" }
last_reviewed: "2026-08-04"
