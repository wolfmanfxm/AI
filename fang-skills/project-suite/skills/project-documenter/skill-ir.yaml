# Skill IR: project-documenter — machine-readable, regenerated on skill.yaml change
id: project-documenter
version: "1.3.0"
mode: Production
description: "生成和维护项目文档：API 文档（从 JSDoc/代码提取）、README、ADR、Changelog、组件文档。 自动匹配项目已有文档风格，所有内容基于代码事实不编造。 触发词：生成文档、写文档、补文档、API 文档、README、更新文档、补全文档、 generate docs、write documentation、update README、api docs、组件文档。 产出：文档文件（.md），含 Evidence Header。API/组件文档同步到 Knowledge Vault。"
boundary: "只生成文档不改代码，API/组件文档同步 Vault 其他留在本地"
produces: [Documentation]
consumes: [Code,Review,KnowledgeBase,Context]
depends_on: [project-reviewer]
stages: [discovery, execution, validation, output]
verification: { checks: 4, source: prompts/verifier.md }
evidence: { format: knowledge-object.schema.json, source: graph.json }
exit_criteria: { conditions: 8, source: prompts/execution.md }
failure_conditions: { modes: 2, levels: "WARNING→retry, DEGRADED→continue, BLOCKED→ask, FATAL→stop" }
last_reviewed: "2026-08-04"
