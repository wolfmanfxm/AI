# Skill IR: project-releaser — machine-readable, regenerated on skill.yaml change
id: project-releaser
version: "1.3.0"
mode: Production
description: "发布管理：semver 版本号推荐（基于 conventional commits）、changelog 自动合成 （git log + PR + REVIEW.md）、发布前检查清单（测试/文档/breaking change/回滚方案）。 触发词：发布、上线、发版、release、changelog、版本号、发布检查、 ship、deploy、version bump、publish、准备发布。 产出：CHANGELOG.md + RELEASE-CHECKLIST.md + 版本号建议。"
boundary: "只检查推荐不执行发布命令，不 npm publish / git push --tags"
produces: [Release]
consumes: [Documentation,Review,Test]
depends_on: [project-documenter]
stages: [discovery, execution, validation, output]
verification: { checks: 4, source: prompts/verifier.md }
evidence: { format: knowledge-object.schema.json, source: graph.json }
exit_criteria: { conditions: 15, source: prompts/execution.md }
failure_conditions: { modes: 2, levels: "WARNING→retry, DEGRADED→continue, BLOCKED→ask, FATAL→stop" }
last_reviewed: "2026-08-04"
