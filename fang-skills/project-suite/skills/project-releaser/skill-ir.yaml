# Skill IR: project-releaser — machine-readable, regenerated on skill.yaml change
id: project-releaser
version: "1.3.0"
mode: Production
description: "发布管理：semver 版本号推荐（基于 conventional commits）、changelog 自动合成（git log + PR + REVIEW.md）、发布前检查清单。 触发词：发布、上线、发版、release、changelog、版本号、发布检查、 ship、deploy、version bump、publish、准备发布。"
boundary: "只检查推荐不执行发布命令，不 npm publish / git push --tags"
produces: [Release]
consumes: [Documentation,Review,Test]
stages: [discovery, execution, validation, delivery]
verification: { checks: 5, source: prompts/validation.md }
evidence: { format: knowledge-object.schema.json, source: graph.json }
failure_conditions: { modes: 3, levels: "WARNING→retry, DEGRADED→continue, BLOCKED→ask, FATAL→stop" }
last_reviewed: "2026-08-04"
