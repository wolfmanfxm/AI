# Skill IR: project-reviewer — machine-readable, regenerated on skill.yaml change
id: project-reviewer
version: "1.3.0"
mode: Production
description: "对代码变更进行五轴审查：正确性、安全性、可读性、架构、性能，问题分级（BLOCKER/HIGH/MEDIUM/LOW），附精确 file:line 引用与可操作修复建议。 触发词：代码审查、review、检查代码、审查 PR、代码质量、code review、security review、 audit code、审查、帮我看看这段代码、这个 PR 怎么样。"
boundary: "只审查不修代码，发现问题记录 file:line + 修复方案由 generator 修复"
produces: [Review]
consumes: [Code,Plan,KnowledgeBase,Architecture,Test]
stages: [discovery, execution, validation, delivery]
verification: { checks: 7, source: prompts/verifier.md }
evidence: { format: knowledge-object.schema.json, source: graph.json }
exit_criteria: { conditions: 6, source: prompts/execution.md }
failure_conditions: { modes: 3, levels: "WARNING→retry, DEGRADED→continue, BLOCKED→ask, FATAL→stop" }
last_reviewed: "2026-08-04"
