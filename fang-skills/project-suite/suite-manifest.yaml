# Suite Manifest v1.1
#
# project-suite 统一治理清单（仅身份 + 版本 + 治理 + 引擎）。
#
# ⚠️ 权威层级（避免多头权威）：
#   per-skill 数据 → skills/*/skill.yaml（唯一人工源）→ runtime/registry/*（生成）
#   调度顺序       → runtime/config/scheduler.yaml（skill_order.decision_order / priority）
#   编排           → runtime/registry/workflow-library.yaml + profiles.yaml
#   门禁           → runtime/config/gates.yaml
#   版本兼容       → compatibility.yaml
#   本文件只存「套件身份」与「治理元数据」，不存任何 per-skill 快照或实验快照。

suite:
  name: project-suite
  version: "1.0.0"
  spec_version: "1.1.0"

governance:
  owner: project-suite
  mode: Production+  # targeting Governed
  review_cadence_days: 90
  last_reviewed: "2026-08-04"

engines:
  workflow:
    version: "1.0.0"
    type: Stage Template Injection + Execution Driver + Workflow DSL
    templates: [discovery, execution, validation, delivery, code-audit, graph-analysis]
    dsl_schema: shared/schemas/workflow.schema.json
  runtime:
    version: "0.7.0"
    components: [state-machine, checkpoint, error-recovery, confidence-gate, event-bus, scheduler]

quality_gates:
  G1:  { name: "SKILL.md ≤130行", level: required }
  G2:  { name: "skill.yaml 字段完整", level: required }
  G3:  { name: "反例黑名单 ≥3条 (boundary.md或SKILL.md)", level: required }
  G4:  { name: "checkpoint 机制存在", level: required }
  G5:  { name: "职责边界表 ✅/❌ ≥3行", level: required }
  G6:  { name: "description 含触发词+产出", level: required }
  G7:  { name: "skills.generated.yaml 已注册", level: important }
  G8:  { name: "完成后 next-step hint", level: important }
  G9:  { name: "boundary.md 含失败兜底", level: important }
  G10: { name: "无runtime-specific措辞", level: important }
  G11: { name: "prompts/ ≥1文件", level: optional }
  G12: { name: "references/ ≥2文件", level: optional }
  G13: { name: "stages与prompts/<stage>.md对应", level: required }
  G14: { name: "stage prompt含@engine:声明", level: required }
  G15: { name: "skill-policy.yaml 含 rollback", level: required }
  G16: { name: "Skill Atlas条目完整", level: important }
  G17: { name: "last_reviewed在cadence内", level: important }
  G18: { name: "scheduler.yaml 每个skill有entry且priority/decision_order唯一", level: important }

compatibility:
  context_schema: ">=1.0.0"
  state_schema: ">=1.0.0"
  skill_interface_schema: ">=1.2.0"  # intrinsic I/O（Runtime Policy 已移至 skill-policy.yaml）
  suite_minimum: ">=0.8.0"
