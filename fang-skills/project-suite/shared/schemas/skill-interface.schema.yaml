# Skill Interface Standard v1.1.0
#
# 所有 skill 的标准化接口定义。
# 每个 skill.yaml 必须包含 interface: 块，Engine 直接解析即可调度。

version: "1.1.0"

# ═══ Interface Fields ═══

fields:

  inputs:
    description: 本 Skill 运行需要什么。Engine 据此检查前置条件。
    type: array
    item_schema:
      name: string          # 资源名，如 "context.json"
      type: string          # artifact-type: knowledge/context/planning/design/code/test/review/documentation/release/state
      required: boolean     # true = 缺失时 BLOCK
      source: string        # producer skill 或文件路径
      fixture: boolean      # v1.2: true = file-backed fixture (可 checksum 验证); false = ephemeral/会话临时
      description: string   # 在本 Skill 中的用途

  outputs:
    description: 本 Skill 产出什么。Engine 据此连接上下游。
    type: array
    item_schema:
      name: string          # 产出文件名或资源名，如 "PLAN.md"
      type: string          # artifact-type
      confidence_range: string  # 典型置信度范围，如 "70-95"
      depends_on_inputs: [string]  # 产出依赖哪些输入

  side_effects:
    description: 执行副作用。Engine 据此决定是否可并行、是否可重试。
    type: object
    properties:
      writes_state: boolean       # 是否写入 .project-runtime/state.json
      writes_knowledge: boolean   # 是否写入 .project-knowledge/
      modifies_code: boolean      # 是否修改项目源码
      writes_timeline: boolean    # 是否追加 timeline.json

  failure_modes:
    description: 已知失败模式。Engine 据此决定重试/降级/阻断。
    type: array
    item_schema:
      condition: string     # 触发条件
      severity: string      # BLOCKER | DEGRADED | WARNING
      recovery: string      # 恢复动作

  quality_gate:
    description: 置信度门禁。Engine 据此决定 PASS/REVIEW/GATE/BLOCK。
    type: object
    properties:
      min_confidence_for_pass: integer   # ≥此值 → 🟢 PASS，直接进入下游
      requires_review_below: integer     # <此值 → 🟡 REVIEW，建议人工审查
      blocks_downstream_below: integer   # <此值 → 🔴 BLOCK，拒绝下游执行

  rollback:
    description: 回滚策略。Engine 据此决定失败后如何处理。
    type: object
    properties:
      method: string        # git_revert | manifest_resume | manual | none
      safe_to_retry: boolean  # 是否可以安全重试
      retry_max: integer      # 最大重试次数，默认 1

  # ═══ v1.1.0 新增 ═══

  stages:
    description: 本 Skill 的阶段列表。Engine 据此加载对应的 Stage Contract 模板。
    type: array
    item_schema:
      name: string          # discovery | planning | execution | validation | delivery
                            # Engine 从 workflow-engine/references/stage-contract.md 加载模板

  recovery:
    description: 中断恢复策略。Engine 据此决定中断后如何 resume。
    type: object
    properties:
      method: string        # manifest_resume | git_revert | ask_user | none
      checkpoint_file: string  # 断点文件，默认 manifest.json
      safe_to_retry: boolean   # 是否可以安全重试
      retry_max: integer       # 最大重试次数

  # ═══ v1.2 新增 ═══

  reliability:
    description: 跨运行可靠性预期。Engine 据此评估多次运行稳定性。
    type: object
    properties:
      structural_stability: string   # high (纯分析) | medium (半生成) | low (生成型)
      expected_confidence_delta: integer  # 两次运行 confidence 最大允许差
      output_file_count_tolerance: string # 文件数允许波动范围，如 "20%"
