# Full SDLC Workflow（参考模板）
# 用户是 Dispatcher — 此模板仅供 Skill 的"完成后下一步"建议参考

name: full-sdlc
description: 全流程参考：分析 → 规划 → 架构 → 生成 → 测试 → 审查 → 发布
version: "1.0.0"

stages:
  - skill: project-analyzer
    depends_on: []
    suggest_next: project-planner

  - skill: project-planner
    depends_on: [project-analyzer]
    suggest_next: project-architect
    note: "confidence < 40 时建议补充信息后重试"

  - skill: project-architect
    depends_on: [project-planner]
    suggest_next: project-generator

  - skill: project-generator
    depends_on: [project-planner, project-architect]
    suggest_next: project-tester
    note: "有 CHECKPOINT，建议用户确认后再推进"

  - skill: project-tester
    depends_on: [project-generator]
    suggest_next: project-reviewer

  - skill: project-reviewer
    depends_on: [project-tester]
    suggest_next: project-documenter
    note: "发现 BLOCKER 时建议先修复再推进"

  - skill: project-documenter
    depends_on: [project-reviewer]
    suggest_next: project-releaser

  - skill: project-releaser
    depends_on: [project-documenter, project-reviewer]
    suggest_next: null
    note: "建议人工审核后发布"

# 并行建议（同 Wave 无互依赖）：
#   tester + documenter 可并行（都只依赖 generator）
