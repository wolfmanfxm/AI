# Quick Change Workflow（参考模板）
# 用户是 Dispatcher — 此模板仅供 Skill 的"完成后下一步"建议参考

name: quick-change
description: 轻量改动参考：规划 → 生成 → 审查
version: "1.0.0"

stages:
  - skill: project-planner
    depends_on: []
    suggest_next: project-generator
    note: "快速拆解为 1-3 个 Task，confidence < 40 时建议补充信息"

  - skill: project-generator
    depends_on: [project-planner]
    suggest_next: project-reviewer
    note: "有 CHECKPOINT，建议用户确认代码后推进"

  - skill: project-reviewer
    depends_on: [project-generator]
    suggest_next: null
    note: "发现 BLOCKER 时建议回 project-generator 修复"
