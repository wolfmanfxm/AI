# Project Principles Schema v1.0
#
# 定义「原则怎么工作」（类型 + enforcement + 消费方式）。
# 真正的原则数据来自 `.project-knowledge/principles.yaml`（Analyzer 从项目提取）。
# 本文件是 Schema，不含任何具体项目的原则。
# 与 Spec Kit Constitution 对应：guiding principles that all phases check against.

version: "1.0.0"

# 原则类型（通用 schema，不含具体项目名）
types:
  form_standard:     # 表单规范
    description: "所有信息填写功能必须使用的组件/模式"
    enforcement: hard  # hard=违反则 BLOCK, soft=违反则 WARN
  api_standard:      # API 规范
    description: "所有 API 调用必须遵循的模式"
    enforcement: hard
  permission_model:  # 权限模型
    description: "权限控制的实现方式"
    enforcement: hard
  type_safety:       # 类型安全
    description: "TypeScript 使用规范"
    enforcement: soft
  naming_convention: # 命名规范
    description: "文件/组件/函数命名规则"
    enforcement: soft

# 原则数据样例（结构示例，实际数据从 .project-knowledge/principles.yaml 注入）
principles_example:
  - id: principle.<kebab-name>
    type: form_standard              # 对应 types 里的某个类型
    statement: "<本项目的原则陈述>"     # 具体陈述来自项目，如「所有表单用统一封装」
    scope: project
    source: graph.json#pattern.<id>  # 证据源
    confidence: 0.9
    enforcement: hard
    evidence: ["<统计证据，如 N 处使用>"]

# 各 Skill 消费方式（机制，通用）
consumers:
  planner:
    use: "Plan 阶段: 每个 Task 检查是否违反 Project Principle → 违反则标注"
    output: "PLAN.md #Decision: 标注受哪些 Principle 约束"
  architect:
    use: "Architecture 阶段: 每个 ADR 对照 Principle → 违反需提供理由"
    output: "ARCHITECTURE.md: 每个 decision 标注 principle_compliance"
  reviewer:
    use: "Review 阶段: 代码是否遵循 Principle → 违反则标注 BLOCKER(硬)/WARNING(软)"
    output: "REVIEW.md: principle_violations 独立章节"
  generator:
    use: "Generate 阶段: 生成代码前查询 Principle → 自动遵循"
    output: "代码: 注释标注遵循的 Principle"
