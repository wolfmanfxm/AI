# Capability Registry
#
# 统一的能力注册中心。每个 skill 声明 produces（产出什么）和 consumes（依赖什么）。
# Scheduler 读取此文件构建 DAG，自动识别并行分支。

version: "1.1.0"
generated: 2026-07-28

# --- 能力类型定义 ---
capability_types:
  KnowledgeBase:    # .project-knowledge/ + context.json
    description: 项目结构化知识（架构/组件/API/模式/编码约定），含生命周期状态
    format: [.md, .json]
  Context:          # context.json
    description: 下游 skill 标准上下文（技术栈/路径别名/约定/模块清单）
    format: [.json]
  State:            # .project-runtime/state.json + knowledge.json
    description: 项目持久化状态（执行历史/置信度/知识生命周期），Skill 共享记忆
    format: [.json]
  Graph:            # graph.json
    description: 项目结构关系图谱（nodes+edges），支持 graph-query.md 6种标准查询
    format: [.json]
  Plan:             # PLAN.md（9 模块 Contract）
    description: Goal / Scope / Context / Reuse Analysis / Decision / Task Breakdown / Dependency Graph / Risk Assessment / Acceptance Criteria
    format: [.md]
  Architecture:     # ARCHITECTURE.md
    description: 技术选型 + 模块设计 + API 契约（ADR 格式）
    format: [.md]
  Code:             # .vue / .ts / .js
    description: 生产级代码
    format: [.vue, .ts, .js]
  Test:             # .test.ts / .spec.ts + TEST-REPORT.md
    description: 测试文件 + 测试报告
    format: [.ts, .md]
  Review:           # REVIEW.md
    description: 五轴审查报告（分级问题 + 修复建议）
    format: [.md]
  RefactoredCode:   # .vue / .ts / .js（重构后）
    description: 重构后代码（行为不变）+ REFACTOR.md
    format: [.vue, .ts, .js, .md]
  Documentation:    # API/组件/Changelog 文档
    description: 结构化技术文档
    format: [.md]
  Release:          # CHANGELOG.md + RELEASE-CHECKLIST.md
    description: 发布产物
    format: [.md]

# --- Skill 注册 ---
skills:

  project-analyzer:
    produces: [KnowledgeBase, Context, Graph]
    consumes: []
    description: 7 维度代码分析，生成项目知识库
    triggers_cn: [分析项目, 代码分析, 项目审计, 扫描项目, 更新项目知识, 刷新项目知识]
    triggers_en: [analyze codebase, scan project, project refresh]
    cost: high
    confidence_min: 70
    parallel: false

  project-planner:
    produces: [Plan]
    consumes: [KnowledgeBase, Context, Graph]
    description: Project Planning Engine — 模糊需求收敛为 9 模块执行契约
    triggers_cn: [任务拆解, 开发计划, 需求分析, 排期, 估算工作量]
    triggers_en: [break down tasks, plan sprint, estimate effort]
    cost: medium
    confidence_min: 70
    parallel: false
    artifact_output: artifacts/plans/PLAN-*.md

  project-architect:
    produces: [Architecture]
    consumes: [KnowledgeBase, Plan, Context, Graph]
    description: 技术选型 + 模块设计 + API 契约
    triggers_cn: [架构设计, 技术选型, 模块设计, API 设计]
    triggers_en: [design architecture, tech stack, system design]
    cost: medium
    confidence_min: 70
    parallel: false
    artifact_output: artifacts/decisions/ARCHITECTURE-*.md

  project-generator:
    produces: [Code]
    consumes: [KnowledgeBase, Plan, Architecture, Context, Graph]
    description: 遵循项目模式生成生产级代码
    triggers_cn: [写一个, 实现, 创建组件, 开发, 生成代码]
    triggers_en: [implement, create, build, generate code]
    cost: high
    confidence_min: 70
    parallel: true
    requires_checkpoint: true

  project-tester:
    produces: [Test]
    consumes: [Code, Plan, KnowledgeBase, Context]
    description: 生成并执行测试，对照 Acceptance Criteria 验证
    triggers_cn: [写测试, 测试用例, 单元测试, 集成测试]
    triggers_en: [write tests, test cases, unit test]
    cost: medium
    confidence_min: 70
    parallel: true
    artifact_output: reports/TEST-REPORT.md

  project-reviewer:
    produces: [Review]
    consumes: [Code, Plan, KnowledgeBase, Architecture, Test]
    description: 五轴代码审查 + 分级问题
    triggers_cn: [代码审查, review, 检查代码, 审查 PR]
    triggers_en: [code review, security review, audit code]
    cost: medium
    confidence_min: 70
    parallel: false
    artifact_output: artifacts/reviews/REVIEW-*.md

  project-refactorer:
    produces: [RefactoredCode]
    consumes: [Code, KnowledgeBase, Test, Review]
    description: 安全重构（行为不变）
    triggers_cn: [重构, 优化结构, 提取公共, 简化代码]
    triggers_en: [refactor, clean up, extract method, simplify]
    cost: medium
    confidence_min: 70
    parallel: false
    requires_tests: true

  project-documenter:
    produces: [Documentation]
    consumes: [Code, Review, KnowledgeBase, Context]
    description: 生成结构化技术文档
    triggers_cn: [生成文档, API 文档, 组件文档, 写文档]
    triggers_en: [generate docs, api docs, write documentation]
    cost: medium
    confidence_min: 60
    parallel: true

  project-releaser:
    produces: [Release]
    consumes: [Documentation, Review, Test]
    description: 版本 bump + Changelog + 发布检查
    triggers_cn: [发布, 上线, 发版, changelog]
    triggers_en: [release, ship, deploy, version bump]
    cost: low
    confidence_min: 70
    parallel: false
    requires_review: true

# --- DAG 边（从 consumes/produces 自动推导） ---
# 规则：若 skill_B.consumes 包含 skill_A.produces 的任一类型，则 A → B
#
# analyzer        → planner, architect, generator, reviewer, refactorer, documenter
# planner         → architect, generator, tester, reviewer
# architect       → generator
# generator       → tester, reviewer, refactorer, documenter
# tester          → reviewer, refactorer
# reviewer        → documenter, releaser
# documenter      → releaser

# --- 并行度分析（v0.7.0 结论） ---
#
# 当前 DAG 唯一确定的并行点：wave_7（refactorer ‖ documenter）
#
# 为什么并行度有限？
#   1. reviewer 依赖 Test（tester 产出）→ tester 必须先于 reviewer
#   2. documenter 依赖 Review（reviewer 产出）→ reviewer 必须先于 documenter
#   3. planner → architect 是串行的（architect 需要 Plan）
#   4. generator 依赖 architect 产出 → 不可与 architect 并行
#
# 这是正确的！严格的依赖链保证了信息完整性。
# 用户可通过跳过非必要 skill（如不需 architect 时直接 planner → generator）
# 来缩短链路，而非强行并行化有依赖关系的 skill。

# --- 调度顺序（拓扑排序） ---
schedule_order:
  wave_1: [project-analyzer]                                      # 无依赖
  wave_2: [project-planner]                                       # 依赖 analyzer
  wave_3: [project-architect]                                     # 依赖 planner
  wave_4: [project-generator]                                     # 依赖 architect
  wave_5: [project-tester]                                        # 依赖 generator
  wave_6: [project-reviewer]                                      # 依赖 tester（等 Code）
  wave_7: [project-refactorer, project-documenter]                # 依赖 reviewer + generator
  wave_8: [project-releaser]                                      # 依赖 documenter
