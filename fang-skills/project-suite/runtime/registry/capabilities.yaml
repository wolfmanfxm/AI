# Capability Registry v3.0 — 自动生成，勿手改
# 单一源：per-skill 调度数据以 skills.generated.yaml 为准；本文件只存能力类型 + 能力依赖顺序。
# Scheduler 读本文件构建 DAG。capability_order 从 produces/consumes 自动推导（能力依赖，非强制执行）。

version: "3.0.0"
generated: true

# --- 能力类型定义 ---
capability_types:
  KnowledgeBase:    # .project-knowledge/ + context.json
    description: 项目结构化知识（架构/组件/API/模式/编码约定），含生命周期状态
    format: [.md, .json]
  KnowledgeIndex:   # knowledge-index.json
    description: Capability→文件映射，Skill 按能力标签而非文件路径查询知识
    format: [.json]
  Context:          # context.json
    description: 下游 skill 标准上下文（技术栈/路径别名/约定/模块清单）
    format: [.json]
  State:            # .project-runtime/state.json + knowledge.json
    description: 项目持久化状态（执行历史/置信度/知识生命周期）
    format: [.json]
  Graph:            # graph.json
    description: 项目结构关系图谱（nodes+edges），支持 6 种标准查询
    format: [.json]
  Plan:             # PLAN.md（9 模块 Contract）
    description: Goal / Scope / Context / Reuse / Decision / Task / Deps / Risk / Acceptance
    format: [.md]
  Architecture:     # ARCHITECTURE.md
    description: 技术选型 + 模块设计 + API 契约（ADR 格式）
    format: [.md]
  Code:             # 源码文件（扩展名按项目技术栈）
    description: 生产级代码
    format: [.ts, .js]
  Test:             # .test.ts / .spec.ts + TEST-REPORT.md
    description: 测试文件 + 测试报告
    format: [.ts, .md]
  Review:           # REVIEW.md
    description: 五轴审查报告（分级问题 + 修复建议）
    format: [.md]
  RefactoredCode:   # 源码文件（重构后）
    description: 重构后代码（行为不变）+ REFACTOR.md
    format: [.ts, .js, .md]
  Documentation:    # API/组件/Changelog 文档
    description: 结构化技术文档
    format: [.md]
  Release:          # CHANGELOG.md + RELEASE-CHECKLIST.md
    description: 发布产物
    format: [.md]
  PipelineExecution: # pipeline-state.json + pipeline-report.md
    description: Pipeline 执行记录 + 报告
    format: [.json, .md]

# --- 能力依赖顺序（拓扑排序，由 produces/consumes 推导，排除 orchestrator）---
# 注意：这是「能力满足的先后」，不是「强制 skill 执行顺序」。
# 能力可能来自已有 .project-knowledge（如 KnowledgeBase），是否真跑 producer 由 workflow/profile 决定。
capability_order:
  wave_1: [project-analyzer]
  wave_2: [project-planner]
  wave_3: [project-architect]
  wave_4: [project-generator]
  wave_5: [project-tester]
  wave_6: [project-reviewer]
  wave_7: [project-documenter, project-refactorer]
  wave_8: [project-releaser]
