# Skill Catalog v3.0 — 自动生成，勿手改
# 单一源：category 分组从 skills.generated.yaml 派生，decision_model 为框架常量。
# 回答"这个任务应该用哪个 Skill？"

version: "3.0.0"
generated: true

categories:
  analysis:
    label: 分析与理解
    description: 代码库结构、组件、API、模式分析
    skills: [project-analyzer]
  planning:
    label: 规划与设计
    description: 需求收敛、任务规划、架构设计
    skills: [project-planner, project-architect]
  creation:
    label: 生成与实现
    description: 代码生成、文档生成
    skills: [project-generator, project-documenter]
  verification:
    label: 验证与审查
    description: 测试、代码审查
    skills: [project-tester, project-reviewer]
  evolution:
    label: 演进与发布
    description: 重构、发布
    skills: [project-refactorer, project-releaser]
  orchestration:
    label: 编排
    description: 跨 Skill 流水线编排
    skills: [pipeline-orchestrator]

# 四步决策模型
decision_model:
  step_1:
    name: Skill Resolver
    question: "哪个 Skill？"
    input: user_task
    output: matched_skill
    source: skill-catalog.yaml + capability-routing.yaml
  step_2:
    name: Knowledge Resolver
    question: "需要哪些知识？"
    input: matched_skill + project_context
    output: curated_knowledge
    source: context-resolver.md + graph.json
  step_3:
    name: Decision Engine
    question: "基于这些知识应该怎么做？"
    input: curated_knowledge + requirement
    output: decision_context
    source: completeness-check.md + adaptive-interview
  step_4:
    name: Execution
    question: "怎么执行？"
    input: decision_context + skill_contract
    output: artifacts
    source: workflow-engine + skill prompts
