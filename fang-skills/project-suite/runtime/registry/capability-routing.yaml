# Capability Routing v1.0
#
# 用户意图 → 能力匹配 → Skill 路由。
# Runtime 读取此文件，做语义匹配而非字符串匹配 Trigger Words。
# Trigger Words 是入口，Capability 是真正能力。

version: "1.0.0"

routing:
  ProjectAnalysis:
    description: 分析代码库结构、组件、API、模式，生成结构化知识库
    intents:
      cn: [分析项目, 扫描代码, 了解架构, 代码审计, 梳理组件, 项目规范, 编码规范, 刷新知识]
      en: [analyze codebase, scan project, project audit, project refresh]
    provider: project-analyzer
    produces: [KnowledgeBase, Context, Graph, KnowledgeIndex]
    requires: { inputs: [ProjectRoot], fixtures: [] }
    confidence_min: 70

  Planning:
    description: 将模糊需求收敛为9模块可执行计划
    intents:
      cn: [规划, 拆任务, 估时, 排期, 需求分析, 任务拆分, sprint规划]
      en: [plan, estimate, break down, sprint planning, task breakdown]
    provider: project-planner
    produces: [Plan]
    requires: { inputs: [KnowledgeBase], fixtures: [context.json, knowledge-index.json] }
    confidence_min: 70

  ArchitectureDesign:
    description: 技术选型、模块设计、API契约设计
    intents:
      cn: [架构设计, 技术选型, 模块设计, 系统设计, API设计, 架构评审]
      en: [architecture design, tech stack, system design, API design]
    provider: project-architect
    produces: [Architecture]
    requires: { inputs: [Plan], fixtures: [context.json, PLAN.md] }
    confidence_min: 70

  CodeGeneration:
    description: 按项目规范生成生产级代码
    intents:
      cn: [写代码, 生成, 实现, 创建组件, 新增页面, 开发功能]
      en: [generate code, implement, create component, build feature]
    provider: project-generator
    produces: [Code]
    requires: { inputs: [KnowledgeBase, Plan], fixtures: [context-package.json, PLAN.md] }
    confidence_min: 70

  Testing:
    description: 生成测试用例、执行测试、生成覆盖率报告
    intents:
      cn: [写测试, 测试用例, 单元测试, 集成测试, 测试覆盖, 跑测试]
      en: [write tests, test cases, unit test, test coverage]
    provider: project-tester
    produces: [Test]
    requires: { inputs: [Code, Plan], fixtures: [被测代码] }
    confidence_min: 70

  CodeReview:
    description: 五轴代码审查，问题分级
    intents:
      cn: [代码审查, review, 检查代码, 审查PR, 代码质量]
      en: [code review, security review, audit code]
    provider: project-reviewer
    produces: [Review]
    requires: { inputs: [Code, Plan], fixtures: [变更代码] }
    confidence_min: 70

  Refactoring:
    description: 安全重构，行为不变
    intents:
      cn: [重构, 优化结构, 提取公共, 简化代码, 消除重复]
      en: [refactor, clean up, extract method, simplify]
    provider: project-refactorer
    produces: [RefactoredCode]
    requires: { inputs: [Code, Test], fixtures: [现有测试] }
    confidence_min: 70

  Documentation:
    description: 生成API/组件/README文档
    intents:
      cn: [生成文档, 写文档, API文档, 组件文档, 更新文档]
      en: [generate docs, api docs, write documentation]
    provider: project-documenter
    produces: [Documentation]
    requires: { inputs: [Code], fixtures: [源码文件] }
    confidence_min: 60

  Release:
    description: 版本号推荐、Changelog合成、发布检查
    intents:
      cn: [发布, 上线, 发版, changelog, 版本号, 发布检查]
      en: [release, ship, deploy, version bump]
    provider: project-releaser
    produces: [Release]
    requires: { inputs: [Documentation, Review], fixtures: [state.json] }
    confidence_min: 70

  PipelineOrchestration:
    description: 跨Skill全流程编排
    intents:
      cn: [全流程, 一键执行, 自动编排, pipeline, 端到端]
      en: [full pipeline, orchestrate, end-to-end, auto sdlc]
    provider: pipeline-orchestrator
    produces: [PipelineExecution]
    requires: { inputs: [], fixtures: [capabilities.yaml, workflow-library.yaml] }
    confidence_min: 80

# 匹配规则
matching:
  # 1. 精确 Intent 匹配 → 直接路由
  # 2. 模糊 Intent 匹配 → 展示 Top-3 能力让用户选择
  # 3. 多能力匹配 → 按 consumes 是否有上游产出排序，已有产出的优先
  # 4. 无匹配 → 展示全部能力列表
  strategy: [exact_intent, fuzzy_top3, availability_sort, full_list]

# 能力依赖图（同 produces/consumes DAG，以能力视角表达）
dependency_graph:
  ProjectAnalysis: { provides: [KnowledgeBase, Context, Graph], needs: [] }
  Planning:        { provides: [Plan], needs: [KnowledgeBase] }
  ArchitectureDesign: { provides: [Architecture], needs: [KnowledgeBase, Plan] }
  CodeGeneration:  { provides: [Code], needs: [KnowledgeBase, Plan, Architecture] }
  Testing:         { provides: [Test], needs: [Code, Plan] }
  CodeReview:      { provides: [Review], needs: [Code, Plan, Test] }
  Refactoring:     { provides: [RefactoredCode], needs: [Code, Test, Review] }
  Documentation:   { provides: [Documentation], needs: [Code, Review] }
  Release:         { provides: [Release], needs: [Documentation, Review, Test] }
