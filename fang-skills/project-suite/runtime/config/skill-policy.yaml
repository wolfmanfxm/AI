# Skill Runtime Policy — 每 skill 的回滚/恢复/可靠性/stage 策略
#
# 权威边界：本文件 = Runtime Policy（编排层）；skill.yaml = Skill Contract（intrinsic）。
# 调整 Runtime 策略只改这里，不动 skill.yaml。见 docs/roadmap.md「定位」。
#
# 字段分工（消除多头权威，见 ADR-003）：
#   - quality_gate（conf 阈值 pass/review/block）→ 唯一权威 = runtime/config/rules.yaml 的 `gate`，本文件不再重复。
#   - 本文件只管 rules.yaml 没有的执行策略：rollback / recovery / reliability / stage_config。
#   - skill.yaml 不再含 confidence_min（该字段已移除，见 ADR-003）。
#
# ⚠️ 状态：Declared（已声明，未 Enforced）——runtime 目前是 Protocol 非 Engine，
#    没有任何代码 read 本文件。本文件定义了「应该怎么执行」，但运行时强制执行需 Engine 接入
#    （对应 roadmap「Enforced」状态当前为空）。在 Engine 接入前，本文件是「权威声明 + 文档」。
#
version: "1.0.0"

project-analyzer:
  rollback: { method: manifest_resume, safe_to_retry: true, retry_max: 1 }
  recovery: { method: manifest_resume, checkpoint_file: manifest.json, safe_to_retry: true, retry_max: 1 }
  reliability: { structural_stability: high, expected_confidence_delta: 10, output_file_count_tolerance: "10%" }
  stage_config:
    discovery: { checkpoint: true, retry: 0 }
    execution: { checkpoint: false, retry: 1, parallel: true }
    validation: { checkpoint: false, retry: 0, blocking: true }
    delivery: { checkpoint: false, retry: 1 }

