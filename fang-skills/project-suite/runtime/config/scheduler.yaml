# Scheduler Configuration v1.0.0
# 机器可读的调度配置。替代 scheduler.md 中的自然语言描述。

version: "1.0.0"

strategy:
  mode: parallel           # parallel | sequential | adaptive
  max_parallel: 6          # 同 Wave 最大并行 skill 数
  dag_source: ../registry/capabilities.yaml  # DAG 来源（从 produces/consumes 推导）

# ── Skill 路由/调度顺序（从 skill.yaml 迁出，编排层权威）──
# decision_order = 路由决策顺序（哪个 Skill 先尝试匹配）
# priority       = 同 Wave 内调度 tiebreaker（值小优先）
skill_order:
  pipeline-orchestrator: { decision_order: 0, priority: 5 }
  project-analyzer:       { decision_order: 1, priority: 10 }
  project-planner:        { decision_order: 2, priority: 20 }
  project-architect:      { decision_order: 3, priority: 30 }
  project-generator:      { decision_order: 4, priority: 40 }
  project-tester:         { decision_order: 5, priority: 50 }
  project-reviewer:       { decision_order: 6, priority: 55 }
  project-refactorer:     { decision_order: 7, priority: 60 }
  project-documenter:     { decision_order: 8, priority: 65 }
  project-releaser:       { decision_order: 9, priority: 90 }

resume:
  enabled: true            # 断点续传
  state_source: .project-runtime/state.json
  detect_stale: true       # 检测上游产出是否过期

checkpoint:
  mode: decision_boundary  # decision_boundary | per_wave | manual
  auto_approve: false      # 是否自动通过 CHECKPOINT
  timeout_minutes: 30      # CHECKPOINT 超时（0 = 不限）

failure:
  retry: 2                 # 失败重试次数
  retry_delay_seconds: 5   # 重试间隔
  on_exhausted: pause      # pause | skip | abort

confidence:
  source: skill_output     # 从 Skill 的 result.md 读取
  thresholds:
    auto_advance: 90       # ≥ 90 建议自动推进
    warn: 70               # < 70 建议人工确认
    block: 40              # < 40 建议阻断

logging:
  level: info              # debug | info | warn | error
  output: .project-runtime/scheduler.log
