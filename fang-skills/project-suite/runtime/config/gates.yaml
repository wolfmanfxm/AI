# Quality Gates Configuration v1.0.0
# Confidence-driven 质量门禁。Confidence 不只是显示，而是控制流程。

version: "1.0.0"

# 全局门禁
global:
  require_confidence: true     # 所有 Skill 必须输出 confidence
  require_result_md: true      # 所有 Skill 必须输出 result.md
  block_on_blocker: true       # 上游 BLOCKER → 阻断下游

# 每个 Skill 的独立门禁阈值
skills:
  project-analyzer:
    confidence:
      warn_below: 70           # < 70 建议重跑
      block_below: 40           # < 40 阻断下游
    knowledge:
      auto_accept_threshold: 90 # ≥ 90 自动标记为 accepted
      suggest_review_below: 70  # < 70 建议 Reviewer 验证

  project-planner:
    confidence:
      warn_below: 70
      block_below: 40           # PLAN.md confidence < 40 → 阻断 architect
    decisions:
      require_resolved: false   # 不强制所有 Decision 在 planner 阶段 resolve

  project-architect:
    confidence:
      warn_below: 70
      block_below: 50
    decisions:
      min_coverage: 100         # 必须 100% resolve PLAN.md 的 Decision

  project-generator:
    confidence:
      warn_below: 70
      block_below: 50
    knowledge:
      require_accepted: true    # 只读 accepted 状态的知识

  project-tester:
    confidence:
      warn_below: 70
      block_below: 40
    coverage:
      ac_coverage_min: 100      # Acceptance Criteria 测试覆盖率 >= 100%

  project-reviewer:
    confidence:
      warn_below: 70
      block_below: 50
    findings:
      block_on: [BLOCKER]       # 有 BLOCKER 级问题 → 阻断 releaser
      warn_on: [HIGH]

  project-refactorer:
    confidence:
      warn_below: 70
      block_below: 50
    safety:
      require_tests: true       # 必须有测试保护
      block_on_test_failure: true

  project-documenter:
    confidence:
      warn_below: 70
      block_below: 40

  project-releaser:
    confidence:
      warn_below: 70
      block_below: 50
    release:
      require_review: true      # 必须 REVIEW.md 通过
      block_on_breaking_change: ask  # ask | block | warn

# Gate 行为（用户始终有最终决策权）
gate_behavior:
  warn: "展示警告，用户可选择继续"
  block: "展示阻断原因，建议不继续，用户可强制跳过"
  ask: "AskUserQuestion，等待用户决策"
