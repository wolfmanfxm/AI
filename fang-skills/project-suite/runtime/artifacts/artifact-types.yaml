# Artifact Type Registry v1.0.0
#
# 统一的产出物类型系统。Skill 不直接知道哪个 Skill 产生什么文件——
# 而是声明"我消费 planning 类型的 artifact"，Runtime 自动找到 producer。
#
# 这是 Suite 最大的解耦：数据层先统一，调度层才有意义。

# ── 词汇分工（避免与 Capability 混读）──────────────────────
#   Capability（skills/*/skill.yaml 顶层 produces/consumes）：
#     语义 = "我能产出/消费哪种能力"，用于 DAG 推导（B.consumes ∩ A.produces ≠ ∅ → B 依赖 A）。
#     例：KnowledgeBase / Code / Plan / Review / RefactoredCode ...
#   Artifact Type（本文件的 types + mapping）：
#     语义 = "我消费哪种产物类型、谁生产它"，用于 Runtime 路由（producer/consumer 解耦）。
#     例：knowledge / implementation / planning / review / refactored-code ...
#   两者用途不同：Capability = 能力依赖（调度 DAG）；Artifact Type = 数据流（产物路由）。
#   故 analyzer 的 skill.yaml `consumes: []` 是合法的——它消费外部存量代码，不依赖任何 suite skill 的产出；
#   而本文件 mapping 里 analyzer `consumes: [implementation]` 表达的是"输入类型是 implementation"。

version: "1.0.0"

types:

  knowledge:
    description: 项目长期知识（Knowledge Base 持久化产物，由 analyzer 产出，经 Compiler→Resolver→context-package 注入，不作为下游 skill 的直接输入）
    schema: shared/schemas/manifest.schema.json
    schema_version: "1.2.0"
    location: .project-knowledge/
    lifecycle: [draft, verified, accepted, archived]
    producer: project-analyzer
    consumers: []   # 下游经 knowledge-index → context-package 注入，不直接消费 knowledge

  context:
    description: 下游 skill 标准项目上下文（技术栈/路径别名/约定/模块清单）
    schema: runtime/context/context.md
    schema_version: "1.0.0"
    location: .project-knowledge/context.json
    producer: project-analyzer
    consumers: [project-planner, project-architect, project-generator, project-reviewer, project-tester, project-refactorer, project-documenter]

  graph:
    description: 项目结构关系图谱（节点+边）
    schema: ../../shared/schemas/graph.schema.json
    schema_version: "1.0.0"
    location: .project-knowledge/graph.json
    producer: project-analyzer
    consumers: [project-planner, project-architect, project-generator, project-reviewer]

  planning:
    description: 9 模块执行契约（Goal→Scope→Context→Reuse→Decision→Tasks→Deps→Risk→Acceptance），含每个 Task 的 placement/target 放置决议
    schema: skills/project-planner/prompts/task-breakdown.md
    schema_version: "1.0.0"
    location: proposals/PLAN-*.md
    producer: project-planner
    consumers: [project-architect, project-generator, project-reviewer, project-tester]

  design:
    description: 架构决策记录（ADR 格式）— 技术选型/模块设计/API 契约
    schema: skills/project-architect/SKILL.md
    schema_version: "1.0.0"
    location: decisions/ARCHITECTURE-*.md
    producer: project-architect
    consumers: [project-generator, project-reviewer]

  implementation:
    description: 生产级代码（.vue / .ts / .js）
    schema_version: "1.0.0"
    location: workspace/ | src/ | 项目源码目录
    producer: project-generator
    consumers: [project-tester, project-reviewer, project-refactorer, project-documenter]

  test:
    description: 测试文件 + 测试报告
    schema_version: "1.0.0"
    location: "*.test.ts | *.spec.ts + .project-knowledge/reports/TEST-REPORT.md"
    producer: project-tester
    consumers: [project-reviewer, project-refactorer, project-releaser]

  review:
    description: 五轴审查报告（分级问题 + 修复建议 + AC 对照）
    schema_version: "1.0.0"
    location: .project-knowledge/reports/REVIEW-*.md
    producer: project-reviewer
    consumers: [project-generator, project-refactorer, project-documenter, project-releaser]

  refactored-code:
    description: 重构后的代码 + REFACTOR.md 变更记录（行为不变 + 改善指标）
    schema_version: "1.0.0"
    location: workspace/ | src/ + .project-knowledge/reports/REFACTOR.md
    producer: project-refactorer
    consumers: [project-reviewer, project-tester]

  documentation:
    description: API/组件/Changelog 文档（.md + Evidence Header）
    schema_version: "1.0.0"
    location: api/ | components/ | CHANGELOG.md
    producer: project-documenter
    consumers: [project-releaser]

  release:
    description: 发布产物（版本建议 + Changelog + 检查清单）
    schema_version: "1.0.0"
    location: CHANGELOG.md + RELEASE-CHECKLIST.md
    producer: project-releaser
    consumers: []

  state:
    description: 项目持久化状态（执行历史 + 知识生命周期 + 置信度追踪）
    schema: runtime/state/state.md
    schema_version: "1.0.0"
    location: .project-knowledge/runtime/state.json + knowledge.json
    producer: null
    consumers: [all]

  request:
    description: 用户需求/任务描述（Planner 的核心输入，非 skill 产出）
    schema_version: "1.0.0"
    location: user prompt
    producer: null
    consumers: [project-planner]

# Skill → Artifact 映射
# 每个 Skill 通过 artifact type 声明输入输出，不知道 producer/consumer 是谁

mapping:
  project-analyzer:
    produces: [knowledge, context, graph]
    consumes: [implementation]

  project-planner:
    produces: [planning]
    consumes: [request, knowledge, context, graph]

  project-architect:
    produces: [design]
    consumes: [knowledge, context, graph, planning]

  project-generator:
    produces: [implementation]
    consumes: [knowledge, context, graph, planning, design]

  project-tester:
    produces: [test]
    consumes: [knowledge, context, implementation, planning]

  project-reviewer:
    produces: [review]
    consumes: [knowledge, implementation, planning, design, test]

  project-refactorer:
    produces: [refactored-code]
    consumes: [knowledge, implementation, test, review]

  project-documenter:
    produces: [documentation]
    consumes: [knowledge, context, implementation, review]

  project-releaser:
    produces: [release]
    consumes: [documentation, review, test]
